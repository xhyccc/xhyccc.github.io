name: Refresh Google Scholar metrics

on:
  schedule:
    # Daily at 05:17 UTC. GitHub may delay scheduled runs at busy times.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public Scholar profile
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/update_scholar_metrics.py --soft-fail

      - name: Commit changed metrics
        run: |
          if git diff --quiet -- assets/scholar-metrics.json; then
            echo "No metric change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar-metrics.json
          git commit -m "Refresh Google Scholar metrics"
          git push
